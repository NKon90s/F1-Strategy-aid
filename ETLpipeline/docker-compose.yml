services:
  db:  
    container_name: postgres_container
    image: postgres:17.10
    ports:
      - 5000:5432 # because postgres use port 5432 by default. So I bind 5000 local port to it. 
    environment:
    # in real production avoid hardcoding passwords
      POSTGRES_DB: db
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    volumes:
      - ./database/data:/var/lib/postgresql/data
      - ./database/airflow_init.sql:/docker-entrypoint-initdb.d/airflow_init.sql
    networks:
      - my-network

  af:
    container_name: airflow_container
    image: apache/airflow:3.3.0
    ports:
      - 8000:8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@db:5432/airflow_db
      # if airflow tries to access db_connector then it will use the credentials below
      DB_HOST: postgres_container
      DB_PORT: 5432
      DB_NAME: db
      DB_USER: db_user
      # in real production avoid hardcoding passwords
      DB_PASSWORD: db_password
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./api_request:/opt/airflow/api_request
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    networks:
      - my-network
    command: > 
      bash -c "airflow db migrate && airflow standalone"  

    #airflow standalone is for dev purposes only. Do not use this in production.

  dbt:
    container_name: dbt_container
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.latest #found on github
    volumes:
      - ./dbt/my_project:/usr/app
      - ./dbt:/root/.dbt
    working_dir: /usr/app
    environment:
      DBT_PROFILES_DIR: "/root/.dbt"
    depends_on:
      - db
    networks:
      - my-network
    command: run
 

# Postgres, dbt and airflow will communicate through this network
networks:
  my-network:
    driver: bridge 


